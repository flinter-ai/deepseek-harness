# Keyless S1 segment smoke composition: the same service rows the headless
# profile mounts (tools service + system prompt) plus the @flinter/dsh-segment
# bundle, booted through the real Cordis Loader. No TowerH, TowerT, VLM, B2,
# or live provider is referenced; the driver below only calls the single
# registered semantic capability on the tools surface.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: dsh-segment
  name: '@flinter/dsh-segment'