# aws-headless profile layer: swap the credential store for AWS Secrets Manager
# and register the deployment's two OpenAI-compatible model routes.
#
# Keyless on purpose: no region, profile, or secret names anywhere. Both AWS
# providers defer to the default AWS credential chain per request, never at
# boot, so composing this profile makes zero AWS calls.

# The base bundle mounts the env/.env credential store; this profile replaces
# it. Two live rows cannot provide the `credentials` service, so the local row
# is disabled before the AWS row mounts.
- id: credentials
  disabled: true

- insert:
    - id: credentials-aws-secrets-manager
      name: '@deepseek-ai/dsh-credentials-aws-secrets-manager'

# The base bundle mounts llm-pi-ai dormant (zero routes). These hand-declared
# routes keep provider names, endpoints, and credential references in the AWS
# profile rather than in the core bundle. Credentials resolve through the AWS
# Secrets Manager-backed credential service at request time.
- id: llm-pi-ai
  config:
    providers:
      ark-agent-plan:
        displayName: ARK Agent Plan
        apiKeyEnv: ARK_PLAN_API_KEY
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/plan/v3
        models:
          - id: ark-code-latest
            name: ARK Code Latest
            contextWindow: 1048576
            maxTokens: 131072
            input: [text]
      modelflare:
        displayName: Modelflare
        apiKeyEnv: MODELFLARE_API_KEY
        api: openai-completions
        baseURL: https://modelflare.dev/v1
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            input: [text]

# ARK is the AWS default. The worker-home helper and local time-of-day
# selector can choose Modelflare explicitly for a new session.
- id: agent-default-model
  config:
    provider: ark-agent-plan
    model: ark-code-latest
    reasoningEffort: high

# The dsh-pes bundle mounts the searchable-trace plugin; this profile pins its
# engine to the immutable producer SHA so every tool result carries the pin in
# provenance.engine_pin. The engine itself is spawned through the configured
# command seam at call time, never bundled here.
- id: dsh-pes
  config:
    engine_pin: 'c05c3fc747f0aa0fcb9d0603009add71c59e091b'

# The agentic-control P0 seam mounts its two rows: the event-sourced
# investigation service (one investigation per agent, folded from durable
# session events) and the model-facing macro-action tools over it. `start` stays
# a privileged harness channel — the model can assess, finish, or stop-unknown
# but never opens an investigation — and no queue/lease/Fargate retry authority
# enters the composition.
- insert:
    - id: agentic-control
      name: '@deepseek-ai/dsh-agentic-control'

    - id: tool-agentic-control
      name: '@deepseek-ai/dsh-tool-agentic-control'
