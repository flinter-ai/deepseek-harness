name: Sync core to derived branches

# `flinter/core` is the shared DSH integration line.  These branches are
# intentionally updated by pull request rather than by force-pushing or
# auto-merging.  Capability/package updates (for example, dsh-segment or
# dsh-orca-plugin revisions) remain separate integration changes.
on:
  push:
    branches:
      - flinter/core
  workflow_dispatch:

concurrency:
  group: sync-core-derived
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-sync-pr:
    name: Sync core into ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - flinter/local-harness
          - flinter/dsh-segment
          - flinter/aws-runtime

    steps:
      - name: Open or reuse core sync PR
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: flinter/core
          TARGET_BRANCH: ${{ matrix.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const head = `${owner}:${source}`;

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base: target,
              per_page: 100,
            });

            if (openPulls.data.length > 0) {
              core.info(`Existing sync PR #${openPulls.data[0].number}: ${source} -> ${target}`);
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              base: target,
              head: source,
            });

            if (comparison.data.ahead_by === 0) {
              core.info(`No core commits need syncing into ${target}.`);
              return;
            }

            const pull = await github.rest.pulls.create({
              owner,
              repo,
              head: source,
              base: target,
              title: `sync: flinter/core -> ${target}`,
              draft: true,
              body: [
                `This draft PR synchronizes shared changes from \`${source}\` into \`${target}\`.`,
                "",
                "The source branch remains the shared upstream; this PR is intentionally not auto-merged.",
                "Resolve conflicts and run the target profile's checks before merging.",
                "",
                `Source head: \`${source}\``,
                `Target branch: \`${target}\``,
                `Triggered by: ${context.eventName}`,
              ].join("\n"),
            });

            core.info(`Created draft sync PR #${pull.data.number}: ${source} -> ${target}`);
