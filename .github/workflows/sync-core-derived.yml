name: Sync core to derived branches

# `flinter/core` is the shared DSH integration line.  These branches are
# intentionally updated by pull request rather than by force-pushing or
# auto-merging.  Capability/package updates (for example, dsh-segment or
# dsh-orca-plugin revisions) remain separate integration changes.
on:
  push:
    branches:
      - flinter/core
  workflow_dispatch:

concurrency:
  group: sync-core-derived
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-aws-segment-drift:
    name: Warn on AWS/dsh-segment drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the complete branch history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the AWS and segment tips
        env:
          AWS_BRANCH: flinter/aws-runtime
          SEGMENT_BRANCH: flinter/dsh-segment
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${AWS_BRANCH}:refs/remotes/origin/${AWS_BRANCH}" \
            "+refs/heads/${SEGMENT_BRANCH}:refs/remotes/origin/${SEGMENT_BRANCH}"

      - name: Compare AWS runtime with the segment capability line
        env:
          AWS_BRANCH: flinter/aws-runtime
          SEGMENT_BRANCH: flinter/dsh-segment
        run: |
          set -u
          aws_ref="origin/${AWS_BRANCH}"
          segment_ref="origin/${SEGMENT_BRANCH}"

          counts="$(git rev-list --left-right --count "$aws_ref...$segment_ref")"
          read -r aws_only segment_only <<< "$counts"

          set +e
          merge_output="$(git merge-tree --write-tree --messages "$aws_ref" "$segment_ref" 2>&1)"
          merge_status=$?
          set -e

          {
            echo "### AWS/dsh-segment compatibility"
            echo
            echo "- AWS branch: `$AWS_BRANCH`"
            echo "- Segment branch: `$SEGMENT_BRANCH`"
            echo "- AWS-only commits: $aws_only"
            echo "- Segment-only commits: $segment_only"
            echo "- Merge-tree status: $([ "$merge_status" -eq 0 ] && echo clean || echo conflict)"
            if [ -n "$merge_output" ]; then
              echo
              echo '```text'
              echo "$merge_output"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$segment_only" -gt 0 ]; then
            echo "::warning::${AWS_BRANCH} does not contain ${segment_only} commit(s) from ${SEGMENT_BRANCH}; resolve the capability update separately."
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "::warning::AWS/dsh-segment has a textual merge conflict; do not hide it in a core sync PR."
          elif [ "$segment_only" -eq 0 ]; then
            echo "AWS contains the current dsh-segment history and merges cleanly."
          else
            echo "AWS is behind dsh-segment but the current tips merge cleanly; review the separate capability update."
          fi

          # Warnings are intentional evidence for review. They do not turn an
          # AWS profile divergence into a false-green core-sync acceptance.
          exit 0
  open-sync-pr:
    name: Sync core into ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - flinter/local-harness
          - flinter/dsh-segment
          - flinter/aws-runtime

    steps:
      - name: Create sync PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Open or reuse core sync PR
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: flinter/core
          TARGET_BRANCH: ${{ matrix.target }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const head = `${owner}:${source}`;

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base: target,
              per_page: 100,
            });

            if (openPulls.data.length > 0) {
              core.info(`Existing sync PR #${openPulls.data[0].number}: ${source} -> ${target}`);
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: target + "..." + source,
            });

            let driftWarning = "";
            if (target === "flinter/aws-runtime") {
              const segmentComparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: target + "...flinter/dsh-segment",
              });
              if (segmentComparison.data.ahead_by > 0) {
                const compareUrl = `https://github.com/${owner}/${repo}/compare/${target}...flinter/dsh-segment`;
                driftWarning = [
                  "",
                  "> [!WARNING] AWS is behind `flinter/dsh-segment`.",
                  `> The segment line has ${segmentComparison.data.ahead_by} commit(s) not contained in AWS.`,
                  "> This PR only synchronizes core; resolve the segment capability update separately.",
                  `> Compare: ${compareUrl}`,
                ].join("\n");
                core.warning(`AWS/dsh-segment drift detected: ${compareUrl}`);
              }
            }

            if (comparison.data.ahead_by === 0) {
              core.info(`No core commits need syncing into ${target}.`);
              return;
            }

            const pull = await github.rest.pulls.create({
              owner,
              repo,
              head: source,
              base: target,
              title: `sync: flinter/core -> ${target}`,
              draft: true,
              body: [
                `This draft PR synchronizes shared changes from \`${source}\` into \`${target}\`.`,
                "",
                "The source branch remains the shared upstream; this PR is intentionally not auto-merged.",
                "Resolve conflicts and run the target profile's checks before merging.",
                "",
                `Source head: \`${source}\``,
                `Target branch: \`${target}\``,
                `Triggered by: ${context.eventName}`,
                driftWarning,
              ].join("\n"),
            });

            core.info(`Created draft sync PR #${pull.data.number}: ${source} -> ${target}`);
