name: Secret scanning

# This workflow is intentionally keyless. It runs on untrusted pull requests
# and must never be changed to pull_request_target or granted provider secrets.
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify scanner workflow is keyless
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*pull_request_target:' .github/workflows/secret-scanning.yml; then
            echo '::error::The secret scanner must not run on pull_request_target.'
            exit 1
          fi
          if grep -Eq 'secrets\.' .github/workflows/secret-scanning.yml; then
            echo '::error::The secret scanner must not consume repository secrets.'
            exit 1
          fi

      - name: Scan checked-out files
        run: >-
          docker run --rm --network none
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo
          --config /repo/.gitleaks.toml
          --redact
          --no-banner

      - name: Scan changed commits
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${BASE_SHA:-}" = '0000000000000000000000000000000000000000' ] || [ -z "${BASE_SHA:-}" ]; then
            echo 'No previous commit is available; the checked-out-files scan is authoritative.'
            exit 0
          fi
          docker run --rm --network none \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner

  trufflehog:
    name: TruffleHog verified-credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits for verified credentials
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          version: 3.97.1
          extra_args: --only-verified
