name: Self-hosted runner smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  runner-smoke:
    name: ci-linux admission and host readiness
    runs-on: [self-hosted, linux, x64, ci-linux]
    timeout-minutes: 10
    steps:
      - name: Verify Linux x64 runner and Docker readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v node >/dev/null
          command -v pnpm >/dev/null
          command -v docker >/dev/null
          docker info >/dev/null
          printf 'runner=%s os=%s arch=%s node=%s\n' \
            "${RUNNER_NAME:-unknown}" "$(uname -s)" "$(uname -m)" "$(node --version)"

      - name: Verify disposable container execution
        shell: bash
        run: docker run --rm alpine:3.22 true
