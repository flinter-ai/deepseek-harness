name: Runner policy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-policy:
    name: self-hosted Linux runner policy
    runs-on: [self-hosted, linux, x64, ci-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (immutable, scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify all workflow runner selectors
        run: pnpm run verify-ci-runner-policy
